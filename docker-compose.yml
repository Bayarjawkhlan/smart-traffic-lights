services:
  sim:
    build: ./sim
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    env_file:
      - path: ./sim/.env.local
        required: false
    volumes:
      - ./sim/data/experiments:/app/data/experiments
      - ./sim/data/models:/app/data/models

  vision:
    build: ./vision
    ports:
      - "8001:8001"
    environment:
      VISION_CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    volumes:
      - ./vision/videos:/app/videos:ro

  client:
    build:
      context: ./client
      args:
        VITE_SIM_URL: http://localhost:8000
        VITE_VISION_URL: http://localhost:8001
    ports:
      - "8080:80"
    depends_on:
      - sim
      - vision
